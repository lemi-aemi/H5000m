name: Build LemWRT H5000M Final Ultra-Pro

on:
  workflow_dispatch:
    inputs:
      set_hostname:
        description: 'Masukkan Nama Router (Hostname)'
        required: true
        default: 'LemWRT'
      set_lan_ip:
        description: 'Masukkan IP LAN'
        required: true
        default: '10.10.88.1'
      set_ssid:
        description: 'Masukkan Nama WiFi (SSID)'
        required: true
        default: 'LemWRT_PRO'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/lib/node_modules
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h
      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev libncurses-dev zstd
      - name: Clone OpenWrt (H5000M fork) & Custom Branding
        run: |
          # Clone dari fork axieyangb yang sudah menyertakan dukungan device Hiveton H5000M
          # (device ini belum masuk mainline openwrt/openwrt, jadi harus pakai fork/branch khusus)
          git clone https://github.com/axieyangb/openwrt-h5000m.git openwrt
          cd openwrt

          # CUSTOM BRANDING & LOGIN TEXT
          sed -i 's/OpenWrt/LemWRT/g' include/target.mk
          sed -i 's/OpenWrt/LemWRT/g' package/base-files/files/usr/lib/os-release
          sed -i 's/OpenWrt/LemWRT/g' package/base-files/files/etc/banner

          # Mengubah teks versi
          echo "LemWRT H5000M Build" > package/base-files/files/etc/openwrt_version

          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Add Custom Apps & Themes
        run: |
          cd openwrt/package
          # Integrasi Repository Eksternal
          git clone --depth 1 https://github.com/4IceG/luci-app-internet-detector.git
          git clone --depth 1 https://github.com/souwei168/luci-app-store.git
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git
          git clone --depth 1 https://github.com/derisamedia/luci-theme-alpha-reborn.git
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git
          git clone --depth 1 https://github.com/esirplayground/luci-app-poweroff.git
          #git clone --depth 1 https://github.com/4IceG/luci-app-modemband.git
          #git clone --depth 1 https://github.com/4IceG/luci-app-modemdata.git
          git clone --depth 1 https://github.com/obsy/apcontroller.git
          git clone --depth 1 https://github.com/4IceG/luci-app-atinout.git
          git clone --depth 1 https://github.com/4IceG/luci-app-mini-diskmanager.git
          git clone --depth 1 https://github.com/4IceG/luci-app-sms-manager.git
          git clone --depth 1 https://github.com/4IceG/luci-app-lite-watchdog.git
          git clone --depth 1 https://github.com/4IceG/luci-app-3ginfo-lite.git
          git clone --depth 1 https://github.com/immortalwrt-collections/openwrt-filebrowser.git
          git clone --depth 1 https://github.com/sirpdboy/luci-app-poweroffdevice.git
          git clone --depth 1 --branch 1.2.0-APK https://github.com/derisamedia/luci-app-arwi-dashboard.git
          git clone --depth 1 --branch master --single-branch --no-checkout https://github.com/muink/luci-app-tinyfilemanager.git luci-app-tinyfilemanager
          (cd luci-app-tinyfilemanager && umask 022 && git checkout master)

          cd ..
          # Install Feeds Tambahan & Dependencies
          ./scripts/feeds install airoha-en7581-mt7996-npu-firmware apk-openssl \
          attendedsysupgrade-common base-files blkid block-mount \
          btrfs-progs busybox ca-bundle cgi-io chat comgt cpulimit curl dbus default-settings \
          default-settings-chn dnsmasq-full dosfstools dropbear e2fsprogs ethtool exfat-fsck exfat-mkfs \
          external-protocol fdisk firewall4 fstools fwtool getrandom glib2 gpsd gpsd-utils \
          hostapd-common ip-tiny ip6tables-nft ipset \
          iptables-mod-conntrack-extra iptables-mod-extra iptables-mod-ipopt iptables-mod-tproxy \
          iptables-nft iw-full iwinfo jansson4 jshn jsonfilter kernel \
          kmod-button-hotplug kmod-cfg80211 kmod-crypto-acompress \
          kmod-crypto-aead kmod-crypto-arc4 kmod-crypto-blake2b kmod-crypto-ccm kmod-crypto-cmac \
          kmod-crypto-crc32 kmod-crypto-crc32c kmod-crypto-ctr kmod-crypto-ecb kmod-crypto-gcm \
          kmod-crypto-geniv kmod-crypto-gf128 kmod-crypto-ghash kmod-crypto-hash kmod-crypto-hmac \
          kmod-crypto-manager kmod-crypto-michael-mic kmod-crypto-null kmod-crypto-rng kmod-crypto-seqiv \
          kmod-crypto-sha1 kmod-crypto-sha3 kmod-crypto-sha512 kmod-crypto-user kmod-crypto-xxhash \
          kmod-fs-btrfs kmod-fs-exfat kmod-fs-ext4 \
          kmod-fs-f2fs kmod-fs-msdos kmod-fs-ntfs3 kmod-fs-vfat kmod-hid kmod-hid-generic kmod-hwmon-core \
          kmod-i2c-core kmod-input-core \
          kmod-input-evdev kmod-ip6tables kmod-ipt-conntrack kmod-ipt-conntrack-extra kmod-ipt-core \
          kmod-ipt-extra kmod-ipt-ipopt kmod-ipt-ipset kmod-ipt-tproxy \
          kmod-lib-crc-ccitt kmod-lib-crc16 kmod-lib-crc32c kmod-lib-lzo kmod-lib-raid6 kmod-lib-xor \
          kmod-lib-xxhash kmod-lib-zlib-deflate kmod-lib-zlib-inflate kmod-lib-zstd kmod-libeth kmod-libie \
          kmod-libphy kmod-mac80211 kmod-macvlan kmod-md-mod kmod-md-raid0 kmod-md-raid1 kmod-md-raid10 \
          kmod-mdio kmod-mdio-devres kmod-mhi-bus kmod-mii kmod-mmc kmod-mppe kmod-mt76-connac \
          kmod-mt76-core kmod-mt76-sdio kmod-mt76-usb kmod-mt7915-firmware kmod-mt7915e kmod-mt7916-firmware \
          kmod-mt7921-common kmod-mt7921-firmware kmod-mt7921e kmod-mt7921s kmod-mt7921u kmod-mt7922-firmware \
          kmod-mt7925-common kmod-mt7925-firmware kmod-mt7925e kmod-mt7925u kmod-mt792x-common \
          kmod-mt792x-usb kmod-mt7990-firmware kmod-mt7992-23-firmware kmod-mt7992-firmware \
          kmod-mt7996-233-firmware kmod-mt7996-firmware kmod-mt7996-firmware-common kmod-mt7996e \
          kmod-net-selftests kmod-nf-conncount kmod-nf-conntrack kmod-nf-conntrack-netlink kmod-nf-conntrack6 \
          kmod-nf-flow kmod-nf-ipt kmod-nf-ipt6 kmod-nf-log kmod-nf-log6 kmod-nf-nat kmod-nf-nathelper \
          kmod-nf-reject kmod-nf-reject6 kmod-nf-tproxy kmod-nfnetlink kmod-nft-compat kmod-nft-core \
          kmod-nft-fib kmod-nft-fullcone kmod-nft-nat kmod-nft-offload kmod-nls-base kmod-nls-cp437 \
          kmod-nls-cp932 kmod-nls-cp936 kmod-nls-cp950 kmod-nls-iso8859-1 kmod-nls-utf8 \
          kmod-pcs-xpcs kmod-phy-ax88796b kmod-phylink kmod-ppp kmod-pppoe kmod-pppox kmod-pps kmod-ptp \
          kmod-qcom-qmi-helpers kmod-qrtr kmod-qrtr-mhi \
          kmod-random-core kmod-scsi-core kmod-slhc kmod-stmmac-core kmod-thermal \
          kmod-usb-common kmod-usb-core kmod-usb-hid kmod-usb-net kmod-usb-net-asix kmod-usb-net-asix-ax88179 \
          kmod-usb-net-cdc-ether kmod-usb-net-cdc-mbim kmod-usb-net-cdc-ncm kmod-usb-net-qmi-wwan \
          kmod-usb-net-qmi-wwan-fibocom kmod-usb-net-qmi-wwan-quectel kmod-usb-net-rndis kmod-usb-net-rtl8150 \
          kmod-usb-net-rtl8152-vendor kmod-usb-serial kmod-usb-serial-option kmod-usb-serial-wwan \
          kmod-usb-storage kmod-usb-storage-extras kmod-usb-storage-uas kmod-usb-wdm \
          libatomic1 libattr libblkid1 libblobmsg-json20260213 libc libcomerr0 libcurl4 libdbus libe2p2 \
          libevdev libexpat libext2fs2 libf2fs6 libfdisk1 libffi libgcc1 libgmp10 libipset13 libiptext-nft0 \
          libiptext0 libiptext6-0 libiwinfo-data libiwinfo-lua libiwinfo20230701 libjson-c5 libjson-script20260213 \
          libkmod liblua5.1.5 liblucihttp-lua liblucihttp-ucode liblucihttp0 liblzo2 libmbim libmnl0 \
          libmount1 libncurses6 libnetfilter-conntrack3 libnettle8 libnfnetlink0 libnftnl11 libnghttp2-14 \
          libnl-tiny1 libopenssl-conf libopenssl-legacy libopenssl3 libparted libpci libpcre2 libpthread \
          libqmi libqrtr-glib libreadline8 librt libsensors5 libsmartcols1 libss2 libstdcpp6 libsysfs2 \
          libubox20260213 libubus-lua libubus20251202 libuci20250120 libuclient20201210 libucode20230711 \
          libudebug libudev-zero libusb-1.0-0 libustream-openssl20201210 libuuid1 libxml2-16 libxtables12 \
          lm-sensors logd lsblk lua lua-bit32 lua-rs232 luasocket luci luci-app-3ginfo-lite \
          luci-app-argon-config luci-app-arwi-dashboard luci-app-attendedsysupgrade luci-app-cpulimit \
          luci-app-diskman luci-app-firewall luci-app-gpoint luci-app-imei-changer luci-app-lite-watchdog \
          luci-app-mwan3 luci-app-nlbwmon luci-app-package-manager luci-app-tinyfilemanager \
          php8-mod-ctype php8-mod-fileinfo php8-mod-iconv php8-mod-json php8-mod-mbstring php8-mod-zip \
          luci-app-sms-manager luci-base luci-compat luci-i18n-attendedsysupgrade-zh-cn luci-i18n-base-zh-cn \
          luci-i18n-cpulimit-zh-cn luci-i18n-firewall-zh-cn \
          luci-i18n-package-manager-zh-cn luci-lib-base luci-lib-chartjs luci-lib-ip luci-lib-ipkg \
          luci-lib-jsonc luci-lib-nixio luci-lib-uqr luci-light luci-lua-runtime luci-mod-admin-full \
          luci-mod-network luci-mod-status luci-mod-system luci-proto-external luci-proto-ipv6 \
          luci-proto-mbim luci-proto-modemmanager luci-proto-ppp luci-proto-qmi luci-proto-quectel \
          luci-theme-4lpha luci-theme-argon luci-theme-bootstrap mdadm mkf2fs \
          modemmanager mt7921bt-firmware mt7922bt-firmware mt7925bt-firmware mt7981-wo-firmware \
          mt7986-wo-firmware mt7987-2p5g-phy-firmware mt7988-2p5g-phy-firmware mt7988-wo-firmware \
          mtd mwan3 nano netifd nftables-json nlbwmon ntfs3-mount odhcp6c odhcpd-ipv6only openwrt-keyring \
          owut parted partx-utils pciids pciutils php8 php8-cgi php8-mod-session picocom ppp \
          ppp-mod-pppoe procd procd-seccomp procd-ujail quectel-cm rpcd rpcd-mod-file rpcd-mod-iwinfo \
          rpcd-mod-luci rpcd-mod-rpcsys rpcd-mod-rrdns rpcd-mod-ucode shadow-common shadow-useradd \
          shadow-utils shellsync smartd smartmontools sms-tool socat sysfsutils terminfo ubox ubus \
          ubusd uci uclient-fetch ucode ucode-mod-digest ucode-mod-fs ucode-mod-html ucode-mod-log \
          ucode-mod-lua ucode-mod-math ucode-mod-nl80211 ucode-mod-rtnl ucode-mod-ubus ucode-mod-uci \
          ucode-mod-uclient ucode-mod-uloop uhttpd uhttpd-mod-ubus umbim uqmi urandom-seed urngd \
          usbids usbutils usign webconsole wifi-scripts wireless-regdb wpad-openssl wwan xtables-nft \
          zlib zoneinfo-core ttyd luci-app-ttyd luci-app-openvpn luci-app-wireguard luci-app-speedtest-cpp \
          wget-ssl nano-full luci-app-netspeedtest luci-app-poweroffdevice luci-app-statistics \
          luci-app-adguardhome luci-app-adblock-plus kmod-rtl8821au rtl8821au-firmware \
          luci-app-usb-printer luci-app-samba4 luci-app-mini-diskmanager luci-app-filebrowser \
          apcontroller luci-app-poweroff luci-app-internet-detector luci-app-store

      - name: Inject Custom DNA (Ultimate Branding & Layout)
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults
          cat <<EOF > files/etc/uci-defaults/99-lemwrt-final
          #!/bin/sh
          # 1. Identitas
          uci set system.@system[0].hostname='${{ github.event.inputs.set_hostname }}'
          (echo 'mi1003'; echo 'mi1003') | passwd root
          # 2. Universal Bridge LAN
          uci delete network.lan
          uci set network.lan=interface
          uci set network.lan.device='br-lan'
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='${{ github.event.inputs.set_lan_ip }}'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.device_lan=device
          uci set network.device_lan.name='br-lan'
          uci set network.device_lan.type='bridge'
          for i in \$(ls /sys/class/net | grep -E 'eth|enp|ena'); do
            uci add_list network.device_lan.ports="\$i"
          done
          # 2a. USB Tethering
          uci set network.wan_usb=interface
          uci set network.wan_usb.proto='dhcp'
          uci set network.wan_usb.device='usb0'
          uci set network.wan_usb.metric='20'
          uci set network.device_usb=device
          uci set network.device_usb.name='usb0'
          uci commit network
          # 3. WiFi Setup
          uci set wireless.radio0.disabled='0'
          uci set wireless.radio0.band='5g'
          uci set wireless.radio0.channel='149'
          uci set wireless.radio0.htmode='HE80'
          uci set wireless.radio0.country='US'
          uci set wireless.default_radio0.disabled='0'
          uci set wireless.default_radio0.ssid='${{ github.event.inputs.set_ssid }}'
          uci set wireless.default_radio0.key='mi123456'
          uci set wireless.default_radio0.encryption='sae-mixed'
          uci set wireless.default_radio0.network='lan'
          # 4. Statistik
          uci set luci_statistics.collectd_interface.enable='1'
          uci set luci_statistics.collectd_interface.Interfaces='br-lan usb0'
          uci set luci_statistics.collectd_interface.IgnoreSelected='0'
          uci set nlbwmon.@nlbwmon[0].refresh_interval='2'
          uci set nlbwmon.@nlbwmon[0].top_count='10'
          uci set nlbwmon.@nlbwmon[0].show_interface='1'
          uci set nlbwmon.@nlbwmon[0].show_mac='0'
          uci set nlbwmon.@nlbwmon[0].show_hostname='1'
          uci set nlbwmon.@nlbwmon[0].show_graph='1'
          uci set nlbwmon.@nlbwmon[0].graph_type='0'
          uci set nlbwmon.@nlbwmon[0].history_size='1440'
          # 5. Theme Default: 4lpha (Argon tetap terpasang sebagai pilihan alternatif)
          uci set luci.main.mediaurlbase='/luci-static/luci-theme-4lpha'
          uci commit luci
          # 5a. Theme Argon & Fix-Collision Setup (opsional, tetap dikonfigurasi jika ingin dipakai)
          uci set argon.@global[0].login_footer='LemWRT: High Performance Network'
          uci set argon.@global[0].bing_background='1'
          uci set argon.@global[0].theme_compatibility_mode='1'
          uci set argon.@global[0].darkmode='1'
          uci set argon.@global[0].rounded_corners='1'
          uci set argon.@global[0].custom_color_enable='1'
          uci set argon.@global[0].custom_color_primary='#1abc9c'
          uci set argon.@global[0].custom_color_accent='#e74c3c'
          uci set argon.@global[0].custom_color_header='#34495e'
          uci set argon.@global[0].custom_color_sidebar='#2c3e50'
          uci set argon.@global[0].custom_color_footer='#34495e'
          uci set argon.@global[0].custom_color_link='#e67e22'
          uci set argon.@global[0].custom_color_button='#e67e22'
          uci set argon.@global[0].custom_color_button_hover='#d35400'

          # Optimasi ModemManager agar tidak mengunci port AT (Untuk RM520N-GL)
          uci set modemmanager.@modemmanager[0].loglevel='ERR'
          uci set modemmanager.@modemmanager[0].enable_at_locking='0'
          # 6. RE-GROUPING MENU
          [ -f /usr/share/luci/menu.d/luci-app-statistics.json ] && sed -i 's/"admin\/statistics"/"admin\/statistics_root"/g' /usr/share/luci/menu.d/luci-app-statistics.json
          [ -f /usr/share/luci/menu.d/luci-app-nlbwmon.json ] && sed -i 's/"admin\/bandwidth"/"admin\/statistics_root"/g' /usr/share/luci/menu.d/luci-app-nlbwmon.json
          # MODEM Group
          [ -f /usr/share/luci/menu.d/luci-app-mwan3.json ] && sed -i 's/"admin\/network"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-mwan3.json
          [ -f /usr/share/luci/menu.d/ModemManager.json ] && sed -i 's/"admin\/network"/"admin\/modem"/g' /usr/share/luci/menu.d/ModemManager.json
          [ -f /usr/share/luci/menu.d/luci-app-atinout.json ] && sed -i 's/"admin\/services"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-atinout.json
          [ -f /usr/share/luci/menu.d/luci-app-sms-manager.json ] && sed -i 's/"admin\/services"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-sms-manager.json
          [ -f /usr/share/luci/menu.d/luci-app-modemband.json ] && sed -i 's/"admin\/network"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-modemband.json
          [ -f /usr/share/luci/menu.d/luci-app-modemdata.json ] && sed -i 's/"admin\/network"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-modemdata.json
          [ -f /usr/share/luci/menu.d/luci-app-internet-detector.json ] && sed -i 's/"admin\/services"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-internet-detector.json
          # 3. DNS
          [ -f /usr/share/luci/menu.d/luci-app-adguardhome.json ] && sed -i 's/"admin\/services"/"admin\/dns"/g' /usr/share/luci/menu.d/luci-app-adguardhome.json
          [ -f /usr/share/luci/menu.d/luci-app-adblock-plus.json ] && sed -i 's/"admin\/services"/"admin\/dns"/g' /usr/share/luci/menu.d/luci-app-adblock-plus.json

          # 4. VPN
          [ -f /usr/share/luci/menu.d/luci-app-openvpn.json ] && sed -i 's/"admin\/services"/"admin\/vpn"/g' /usr/share/luci/menu.d/luci-app-openvpn.json
          [ -f /usr/share/luci/menu.d/luci-app-wireguard.json ] && sed -i 's/"admin\/network"/"admin\/vpn"/g' /usr/share/luci/menu.d/luci-app-wireguard.json

          # 5. WIFI
          [ -f /usr/share/luci/menu.d/luci-base.json ] && sed -i 's/"admin\/network\/wireless"/"admin\/wifi"/g' /usr/share/luci/menu.d/luci-base.json
          [ -f /usr/share/luci/menu.d/apcontroller.json ] && sed -i 's/"admin\/network"/"admin\/wifi"/g' /usr/share/luci/menu.d/apcontroller.json
          # 6. NAS (Samba4, FileBrowser & Disk Manager)
          [ -f /usr/share/luci/menu.d/luci-app-samba4.json ] && sed -i 's/"admin\/services"/"admin\/nas"/g' /usr/share/luci/menu.d/luci-app-samba4.json
          [ -f /usr/share/luci/menu.d/luci-app-filebrowser.json ] && sed -i 's/"admin\/services"/"admin\/nas"/g' /usr/share/luci/menu.d/luci-app-filebrowser.json
          [ -f /usr/share/luci/menu.d/luci-app-mini-diskmanager.json ] && sed -i 's/"admin\/nas"/"admin\/nas"/g' /usr/share/luci/menu.d/luci-app-mini-diskmanager.json
          uci commit
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-lemwrt-final
      - name: Load Configuration
        run: |
          cd openwrt
          # Target device: Hiveton H5000M (MediaTek MT7987A / Filogic 880)
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          # PENTING: nama device di bawah ini adalah tebakan terbaik (hiveton_h5000m).
          # Cek nama pastinya dengan `make menuconfig` di repo axieyangb kalau build gagal karena target tidak dikenali.
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_hiveton_h5000m=y" >> .config
          echo "CONFIG_TARGET_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl-openssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          echo "CONFIG_PACKAGE_ttyd=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nls-base=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nls-utf8=y" >> .config
          echo "CONFIG_PACKAGE_block-mount=y" >> .config
          echo "CONFIG_PACKAGE_uboot-envtools=y" >> .config
          echo "CONFIG_PACKAGE_partx-utils=y" >> .config
          echo "CONFIG_PACKAGE_f2fs-tools=y" >> .config
          echo "CONFIG_PACKAGE_e2fsprogs=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-f2fs=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mtd-rw=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mtd=y" >> .config
          echo "CONFIG_PACKAGE_mtd=y" >> .config
          echo "CONFIG_PACKAGE_kmod-crypto-aes=y" >> .config
          echo "CONFIG_PACKAGE_kmod-crypto-ccm=y" >> .config
          echo "CONFIG_PACKAGE_kmod-crypto-crc32c=y" >> .config
          echo "CONFIG_PACKAGE_kmod-crypto-hash=y" >> .config
          echo "CONFIG_PACKAGE_kmod-crypto-manager=y" >> .config
          echo "CONFIG_PACKAGE_kmod-crypto-sha256=y" >> .config
          echo "CONFIG_PACKAGE_kmod-crypto-sha512=y" >> .config
          echo "CONFIG_PACKAGE_libc=y" >> .config
          echo "CONFIG_PACKAGE_libgcc=y" >> .config
          echo "CONFIG_PACKAGE_libpthread=y" >> .config
          echo "CONFIG_PACKAGE_libustream-openssl=y" >> .config
          echo "CONFIG_PACKAGE_openssl-util=y" >> .config
          echo "CONFIG_PACKAGE_openssl=y" >> .config
          echo "CONFIG_PACKAGE_ca-certificates=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_firewall=y" >> .config
          echo "CONFIG_PACKAGE_iptables=y" >> .config
          echo "CONFIG_PACKAGE_iptables-mod-tproxy=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ipt-tproxy=y" >> .config
