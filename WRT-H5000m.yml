      - name: Build Firmware
        run: |
          cd openwrt
          # Menggunakan -k agar build tetap lanjut meskipun ada 1-2 paket yang gagal/incompatible
          make -j$(nproc) -k || make -j1 V=s -k
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LemWRT-H5000M-Final
          # Sesuaikan path ini dengan folder target sebenarnya setelah build pertama.
          # Biasanya: openwrt/bin/targets/mediatek/filogic/
          path: |
            openwrt/bin/targets/mediatek/filogic/*sysupgrade*
            openwrt/bin/targets/mediatek/filogic/*factory*
